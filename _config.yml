# Site settings
title:          7hachiii
description:    "Security and development study blog with AI"
url:            https://7hachiii.github.io

# Author
author:
  name:         7hachiiii
  email:        
  url:          https://7hachiii.github.io

# Build settings
markdown:       kramdown

# Assets
sass:
  sass_dir:     _sass
  style:        compressed

# Gems
plugins:
  - jekyll-feed
  - jekyll-paginate
  # - jemoji #Uncomment this to allow emoji in your post

# Permalinks
permalink:      /:year-:month-:day/:title
paginate:       5

# Related posts settings
related_posts_section:
  max_count:        5
  min_common_tags:  2

# Links to social media
social:
  instagram: https://instagram.com/7hachiii
  github: https://github.com/7hachiii
